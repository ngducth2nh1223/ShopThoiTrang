<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FashionShop - Shop Thời Trang</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-size: 24px;
        }

        .category-box {
            position: sticky;
            top: 20px;
        }

        .product-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            background: white;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12) !important;
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            object-position: center;
            background-color: #f1f1f1;
        }

        .product-name {
            min-height: 48px;
        }

        .price {
            color: #dc3545;
            font-size: 18px;
            font-weight: bold;
        }

        .size-text {
            color: #6c757d;
        }

        .category-title {
            font-size: 18px;
        }

        .list-group-item {
            border-left: none;
            border-right: none;
        }

        .list-group-item:first-child {
            border-top: none;
        }

        .list-group-item:hover {
            background-color: #f1f3f5;
        }

        .shop-title {
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/home}">
            🛍️ FashionShop
        </a>

        <div class="navbar-nav ms-auto align-items-center">

            <!-- Chưa đăng nhập -->
            <span th:if="${session.user == null}">
                <a class="nav-link"
                   th:href="@{/login}">
                    Đăng nhập
                </a>
            </span>

            <!-- Đã đăng nhập -->
            <span th:if="${session.user != null}"
                  class="d-flex align-items-center">

                <span class="nav-link text-light me-2"
                      th:text="'Xin chào, ' + ${session.user.fullname}">
                    Xin chào
                </span>

                <a class="nav-link text-danger"
                   th:href="@{/logout}">
                    Đăng xuất
                </a>
            </span>

            <!-- Giỏ hàng -->
            <a class="nav-link btn btn-outline-light ms-2 px-3"
               th:href="@{/cart/view}">
                🛒 Giỏ hàng
            </a>

        </div>
    </div>
</nav>


<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<div class="container">

    <div class="row">

        <!-- ========================= -->
        <!-- DANH MỤC -->
        <!-- ========================= -->

        <div class="col-md-3 mb-4">

            <div class="card shadow-sm category-box">

                <div class="card-header bg-dark text-white">
                    <span class="category-title fw-bold">
                        📂 Danh mục sản phẩm
                    </span>
                </div>

                <div class="list-group list-group-flush">

                    <!-- Tất cả -->
                    <a th:href="@{/home}"
                       class="list-group-item list-group-item-action fw-bold">

                        Tất cả sản phẩm

                    </a>

                    <!-- Danh mục -->
                    <a th:each="cat : ${categories}"
                       th:href="@{/home(categoryId=${cat.id})}"
                       th:text="${cat.name}"
                       class="list-group-item list-group-item-action">

                        Áo Nam

                    </a>

                </div>
            </div>

        </div>


        <!-- ========================= -->
        <!-- SẢN PHẨM -->
        <!-- ========================= -->

        <div class="col-md-9">

            <h3 class="shop-title">
                🛍️ Sản phẩm thời trang
            </h3>

            <div class="row g-4">

                <!-- Product -->
                <div class="col-lg-4 col-md-6"
                     th:each="p : ${products}">

                    <div class="card product-card h-100 shadow-sm">

                        <!-- ========================= -->
                        <!-- ẢNH SẢN PHẨM -->
                        <!-- ========================= -->

                        <img th:src="@{'/images/products/' + ${p.image}}"
                             th:alt="${p.name}"
                             class="product-image"
                             onerror="this.src='/images/products/default-product.png'">


                        <!-- ========================= -->
                        <!-- THÔNG TIN -->
                        <!-- ========================= -->

                        <div class="card-body d-flex flex-column">

                            <h5 class="card-title fw-bold product-name"
                                th:text="${p.name}">
                                Tên sản phẩm
                            </h5>


                            <!-- Giá -->
                            <p class="price mb-2"
                               th:text="${#numbers.formatDecimal(p.price * (1 - p.discount), 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                350,000 VNĐ
                            </p>


                            <!-- Giá gốc -->
                            <p th:if="${p.discount != null and p.discount > 0}"
                               class="text-muted text-decoration-line-through mb-1">

                                <span
                                    th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                </span>

                            </p>


                            <!-- Giảm giá -->
                            <span th:if="${p.discount != null and p.discount > 0}"
                                  class="badge bg-danger mb-2"
                                  style="width: fit-content;">

                                Giảm
                                <span th:text="${p.discount * 100}"></span>%

                            </span>


                            <!-- Size -->
                            <p class="size-text small mb-3">

                                Size:
                                <strong th:text="${p.size}">
                                    M
                                </strong>

                            </p>


                            <!-- Số lượng -->
                            <p class="text-muted small">
                                Còn lại:
                                <span th:text="${p.quantity}">
                                    0
                                </span>
                                sản phẩm
                            </p>


                            <!-- Nút thêm giỏ -->
                            <a th:href="@{/cart/add(id=${p.id})}"
                               class="btn btn-primary mt-auto w-100">

                                🛒 Thêm vào giỏ

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
