<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đánh giá - FashionStore</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header th:replace="~{fragments/header :: navbar}"></header><div th:replace="~{fragments/admin-nav :: nav('reviews')}"></div>
<main class="container"><h2 class="section-title">Quản lý đánh giá sản phẩm</h2>
<div class="flash flash-ok" th:if="${adminMessage}" th:text="${adminMessage}"></div><div class="flash flash-err" th:if="${adminError}" th:text="${adminError}"></div>
<form th:action="@{/admin/reviews}" method="get" class="search-form"><select name="status"><option value="">Tất cả trạng thái</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Đang hiển thị</option><option value="HIDDEN" th:selected="${status == 'HIDDEN'}">Đã ẩn</option></select><select name="rating"><option value="0">Tất cả số sao</option><option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}" th:text="${n} + ' sao'" th:selected="${rating == n}"></option></select><button class="btn" type="submit">Lọc</button></form>
<p th:if="${#lists.isEmpty(reviews)}" class="empty">Chưa có đánh giá phù hợp.</p>
<div class="table-wrap" th:unless="${#lists.isEmpty(reviews)}"><table class="cart-table"><thead><tr><th>Mã</th><th>Người dùng</th><th>Sản phẩm</th><th>Số sao</th><th>Nội dung</th><th>Ngày đánh giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="r : ${reviews}"><td th:text="${r.reviewId}">1</td><td th:text="${r.userId}">1</td><td th:text="${r.productId}">1</td><td th:text="${r.rating} + ' ★'">5 ★</td><td th:text="${r.comment}">Nội dung</td><td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td><td th:text="${r.status}">ACTIVE</td><td><form th:action="@{/admin/reviews/{id}/visibility(id=${r.reviewId})}" method="post"><button class="btn btn-sm" type="submit" th:text="${'ACTIVE'.equalsIgnoreCase(r.status)} ? 'Ẩn đánh giá' : 'Hiện đánh giá'">Ẩn</button></form></td></tr>
</tbody></table></div></main><footer class="footer">© 2026 FashionStore</footer></body></html>
